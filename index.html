<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Feed Network</title>
  <meta name="description" content="The Feed Network — live streaming news, true crime, FOIA releases, and police scanner coverage." />

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .logo {
      width: 96px;
      height: 96px;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }

    p {
      font-size: 1.1rem;
      color: #8b949e;
      max-width: 480px;
      line-height: 1.6;
    }

    .channels {
      display: flex;
      gap: 1rem;
      margin-top: 2.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .channel-link {
      display: inline-block;
      padding: 0.6rem 1.4rem;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #e6edf3;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: border-color 0.2s, background 0.2s;
    }

    .channel-link:hover {
      border-color: #58a6ff;
      background: #161b22;
    }
  </style>
</head>
<body>
  <img src="/favicon.png" alt="The Feed Network" class="logo" />
  <h1>The Feed Network</h1>
  <p>Live streaming news, true crime, FOIA releases, and police scanner coverage — 24/7.</p>

  <div class="channels">
    <a class="channel-link" href="https://www.youtube.com/@THE_FEED_NETWORK" target="_blank" rel="noopener">
      THE FEED NETWORK ↗
    </a>
    <a class="channel-link" href="https://www.youtube.com/@911feed" target="_blank" rel="noopener">
      911FEED ↗
    </a>
  </div>
</body>
</html>
